<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="195" viewBox="0 0 1200 195" role="img" aria-labelledby="ft fd">
<title id="ft">Nilojan futuristic animated footer</title>
<desc id="fd">Animated neon blue circuit-board footer reading Keep Building, Keep Learning, Keep Exploring.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030917"/><stop offset=".58" stop-color="#06253b"/><stop offset="1" stop-color="#040d22"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0284c7"/><stop offset=".48" stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#38bdf8" stroke-opacity=".085"/><circle r="1.1" fill="#7dd3fc" opacity=".23"/></pattern>
  <clipPath id="edge"><rect x="1" y="1" width="1198" height="193" rx="18"/></clipPath>
</defs>
<style>
  .dash {stroke-dasharray:14 22;animation:travel 5s linear infinite;}
  .dash.back {animation-duration:7s;animation-direction:reverse;}
  .blink {animation:blink 2s ease-in-out infinite alternate;}
  .bar {animation:levels 1.6s ease-in-out infinite alternate;transform-origin:50% 100%;}
  .bar.b {animation-delay:-.5s}.bar.c {animation-delay:-1.1s}
  .cursor {animation:cursor 1.1s steps(2) infinite;}
  @keyframes travel {to{stroke-dashoffset:-220}}
  @keyframes blink {to{opacity:.18}}
  @keyframes levels {to{transform:scaleY(.27)}}
  @keyframes cursor {to{opacity:0}}
  @media(prefers-reduced-motion:reduce){.dash,.blink,.bar,.cursor{animation:none!important}}
</style>
<g clip-path="url(#edge)">
  <rect width="1200" height="195" fill="url(#bg)"/>
  <rect width="1200" height="195" fill="url(#grid)"/>
  <path d="M0 19H350L383 48H451" stroke="#38bdf8" stroke-opacity=".45" stroke-width="2" fill="none"/>
  <path d="M0 19H350L383 48H451" class="dash" stroke="url(#line)" stroke-width="2" fill="none"/>
  <path d="M1200 24H980L940 63H775" stroke="#38bdf8" stroke-opacity=".42" stroke-width="2" fill="none"/>
  <path d="M1200 24H980L940 63H775" class="dash back" stroke="url(#line)" stroke-width="2" fill="none"/>
  <path d="M0 167H310L346 133H451" stroke="#38bdf8" stroke-opacity=".42" stroke-width="2" fill="none"/>
  <path d="M0 167H310L346 133H451" class="dash back" stroke="url(#line)" stroke-width="2" fill="none"/>
  <path d="M1200 166H1012L981 136H788" stroke="#38bdf8" stroke-opacity=".42" stroke-width="2" fill="none"/>
  <path d="M1200 166H1012L981 136H788" class="dash" stroke="url(#line)" stroke-width="2" fill="none"/>
  <circle class="blink" cx="383" cy="48" r="5" fill="#67e8f9"/>
  <circle class="blink" cx="940" cy="63" r="5" fill="#67e8f9"/>
  <circle class="blink" cx="346" cy="133" r="5" fill="#67e8f9"/>
  <circle class="blink" cx="981" cy="136" r="5" fill="#67e8f9"/>
  <rect x="385" y="51" width="430" height="91" rx="12" fill="#031528" stroke="#0ea5e9" stroke-width="1.4" stroke-opacity=".75"/>
  <path d="M404 69H796" stroke="#0ea5e9" stroke-opacity=".35"/>
  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="77" font-family="monospace" letter-spacing="3" font-size="11" fill="#7dd3fc">NILOJAN // END OF TRANSMISSION</text>
    <text x="600" y="108" font-size="24" font-weight="700" fill="#e0faff" letter-spacing="1">KEEP BUILDING. KEEP LEARNING.</text>
    <text x="600" y="131" font-size="17" font-weight="600" fill="#22d3ee" letter-spacing="3">KEEP EXPLORING_</text>
  </g>
  <rect class="cursor" x="709" y="117" width="10" height="16" fill="#67e8f9"/>
  <g fill="#22d3ee">
    <rect class="bar" x="80" y="73" width="7" height="45" rx="2"/>
    <rect class="bar b" x="95" y="58" width="7" height="60" rx="2"/>
    <rect class="bar c" x="110" y="86" width="7" height="32" rx="2"/>
    <rect class="bar b" x="125" y="65" width="7" height="53" rx="2"/>
    <rect class="bar" x="1067" y="70" width="7" height="48" rx="2"/>
    <rect class="bar c" x="1082" y="86" width="7" height="32" rx="2"/>
    <rect class="bar b" x="1097" y="59" width="7" height="59" rx="2"/>
    <rect class="bar" x="1112" y="78" width="7" height="40" rx="2"/>
  </g>
  <text x="33" y="184" font-family="monospace" font-size="10" fill="#38bdf8" opacity=".65">01001110 01001001 01001100</text>
  <text x="970" y="184" font-family="monospace" font-size="11" fill="#38bdf8" opacity=".7">STATUS: ONLINE</text>
</g>
<rect x="1" y="1" width="1198" height="193" rx="18" fill="none" stroke="#38bdf8" stroke-opacity=".40" stroke-width="2"/>
</svg>