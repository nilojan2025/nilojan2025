<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Nilojan — developer profile animated banner</title>
  <desc id="desc">A futuristic blue and cyan animated banner for Nilojan, featuring moving stars, a neon circuit globe, and developer interests.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".52" stop-color="#082f49"/>
      <stop offset="1" stop-color="#091b38"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#0ea5e9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#38bdf8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <clipPath id="border">
      <rect x="1" y="1" width="1198" height="338" rx="22"/>
    </clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .star { animation: twinkle 3s ease-in-out infinite alternate; }
    .star.two { animation-delay: -1.2s; }
    .star.three { animation-delay: -2.1s; }
    .ringA { transform-origin: 971px 168px; animation: spin 24s linear infinite; }
    .ringB { transform-origin: 971px 168px; animation: reverseSpin 33s linear infinite; }
    .orbitDot { transform-origin: 971px 168px; animation: spin 9s linear infinite; }
    .beam { animation: sweep 7s ease-in-out infinite alternate; }
    .pulse { animation: pulsing 3.5s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    .phrase1 { animation: cycle1 12s infinite; }
    .phrase2 { animation: cycle2 12s infinite; }
    .phrase3 { animation: cycle3 12s infinite; }
    @keyframes twinkle { from { opacity: .2; transform: scale(.8); } to { opacity: 1; transform: scale(1.3); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes reverseSpin { to { transform: rotate(-360deg); } }
    @keyframes sweep { from { transform: translateX(-190px); opacity: .05; } to { transform: translateX(1180px); opacity: .28; } }
    @keyframes pulsing { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    @keyframes blink { to { opacity: 0; } }
    @keyframes cycle1 { 0%,27% { opacity: 1; } 33%,94% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes cycle2 { 0%,27% { opacity: 0; } 33%,60% { opacity: 1; } 66%,100% { opacity: 0; } }
    @keyframes cycle3 { 0%,60% { opacity: 0; } 66%,94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .star,.ringA,.ringB,.orbitDot,.beam,.pulse,.cursor,.phrase1,.phrase2,.phrase3 { animation: none !important; }
      .phrase2,.phrase3 { opacity: 0; }
      .phrase1 { opacity: 1; }
    }
  </style>
  <g clip-path="url(#border)">
    <rect width="1200" height="340" rx="22" fill="url(#background)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="967" cy="168" r="270" fill="url(#aura)"/>
    <path d="M0 276C250 190 400 329 651 250S1005 192 1200 238" fill="none" stroke="#0ea5e9" stroke-opacity=".12" stroke-width="2"/>
    <path d="M0 301C285 235 480 346 730 277S1054 249 1200 285" fill="none" stroke="#67e8f9" stroke-opacity=".10" stroke-width="1"/>
    <path class="beam" d="M0 0H3V340H0Z" fill="#67e8f9"/>
    <g fill="#67e8f9">
      <circle class="star" cx="56" cy="59" r="2"/>
      <circle class="star two" cx="268" cy="37" r="1.6"/>
      <circle class="star three" cx="455" cy="74" r="1.5"/>
      <circle class="star two" cx="632" cy="46" r="2"/>
      <circle class="star" cx="764" cy="95" r="1.8"/>
      <circle class="star three" cx="1090" cy="44" r="1.5"/>
      <circle class="star two" cx="1137" cy="283" r="2"/>
      <circle class="star" cx="684" cy="292" r="1.5"/>
      <circle class="star three" cx="84" cy="292" r="1.5"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif">
      <rect x="70" y="47" width="207" height="31" rx="15.5" fill="#0ea5e9" fill-opacity=".13" stroke="#38bdf8" stroke-opacity=".42"/>
      <circle class="pulse" cx="89" cy="62.5" r="4.5" fill="#67e8f9"/>
      <text x="104" y="68" font-size="12" font-weight="700" letter-spacing="1.8" fill="#a5f3fc">WELCOME TO MY WORLD</text>
      <text x="66" y="159" font-size="82" font-weight="800" letter-spacing="3" fill="#eaf9ff">NILOJAN</text>
      <rect x="70" y="177" width="313" height="4" rx="2" fill="url(#cyan)" filter="url(#glow)"/>
      <text x="70" y="215" font-size="21" font-weight="600" fill="#b6eaff">Building ideas with code &amp; circuits</text>
      <g font-size="17" font-weight="500" fill="#67e8f9">
        <text class="phrase1" x="70" y="252">IoT  •  AI  •  Web Development</text>
        <text class="phrase2" x="70" y="252" opacity="0">ESP32  •  Embedded Systems  •  Automation</text>
        <text class="phrase3" x="70" y="252" opacity="0">Learn  •  Build  •  Explore</text>
      </g>
      <rect class="cursor" x="70" y="267" width="19" height="3" fill="#67e8f9"/>
      <text x="70" y="311" font-family="monospace" font-size="12" letter-spacing="2" fill="#7dd3fc" opacity=".65">github.com/nilojan2025</text>
    </g>
    <g transform="translate(971 168)">
      <circle r="125" fill="none" stroke="#38bdf8" stroke-opacity=".10" stroke-width="1"/>
      <circle r="99" fill="none" stroke="#7dd3fc" stroke-opacity=".22" stroke-width="1.4"/>
      <circle r="72" fill="none" stroke="#67e8f9" stroke-opacity=".30" stroke-width="1"/>
      <g class="ringA">
        <circle cx="0" cy="0" r="119" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="95 41 22 580" fill="none" opacity=".75"/>
        <circle cx="0" cy="0" r="92" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 12" fill="none" opacity=".55"/>
      </g>
      <g class="ringB">
        <circle r="108" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="110 570" opacity=".85"/>
        <circle r="82" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="32 480" opacity=".9"/>
      </g>
      <g fill="none" stroke="#67e8f9" stroke-width="1.2" stroke-opacity=".45">
        <ellipse rx="70" ry="28"/>
        <ellipse rx="30" ry="70"/>
        <path d="M-70 0H70M0-70V70"/>
      </g>
      <circle class="pulse" r="49" fill="#0284c7" fill-opacity=".14"/>
      <text x="0" y="20" text-anchor="middle" font-family="monospace" font-weight="800" font-size="51" fill="#e0faff">&lt;/&gt;</text>
    </g>
    <g class="orbitDot">
      <circle cx="971" cy="49" r="5" fill="#67e8f9" filter="url(#glow)"/>
    </g>
    <g font-family="monospace" fill="#67e8f9" font-size="13" opacity=".65">
      <text x="783" y="73">01 / CREATE</text>
      <text x="1055" y="284">BUILD_</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2"/>
</svg>