name: Generate GitHub Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=020617&ring=0EA5E9&fire=38BDF8&currStreakLabel=38BDF8&sideLabels=7DD3FC&dates=94A3B8&currStreakNum=FFFFFF&sideNums=FFFFFF
          path: profile/streak.svg

      - name: Commit streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update GitHub streak card" || exit 0
          git push
